<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
  <title id="title">Scenario 10: Token theft in isolation</title>
  <desc id="desc">Malware in an isolated web session steals a live session token before teardown. How bad is it?</desc>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="730" fill="#ffffff"/>
  <text font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#111827"><tspan x="44" y="48">Scenario 10: Token theft in isolation</tspan></text>
  <text font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#475569"><tspan x="44" y="82">Malware in an isolated web session steals a live session token before teardown. How bad is it?</tspan></text>
  <rect x="44" y="118" width="336" height="282" rx="8" fill="#fffdf7" stroke="#111827" stroke-width="2" stroke-dasharray="9 7"/>
  <text font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#2f6f9f"><tspan x="70" y="156">SCENARIO QUESTION</tspan></text>
  <text font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#111827"><tspan x="70" y="196">Malware in an isolated</tspan><tspan x="70" dy="25">web session steals a</tspan><tspan x="70" dy="25">live session token</tspan><tspan x="70" dy="25">before teardown. How bad</tspan><tspan x="70" dy="25">is it?</tspan></text>
  <text font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#334155"><tspan x="70" y="335">Did a reusable secret leave</tspan><tspan x="70" dy="20">before the isolated</tspan><tspan x="70" dy="20">environment was destroyed?</tspan></text>
  <rect x="408" y="118" width="748" height="282" rx="8" fill="#fbfdff" stroke="#334155" stroke-width="2"/>
  <text font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#2f6f9f"><tspan x="436" y="156">WHITEBOARD ARCHITECTURE</tspan></text>
  <line x1="760" y1="172" x2="760" y2="382" stroke="#64748b" stroke-width="2" stroke-dasharray="8 8"/>
  <text font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#475569"><tspan x="684" y="188">boundary /</tspan><tspan x="684" dy="17">decision</tspan></text>
  <rect x="430" y="224" width="146" height="118" rx="8" fill="#eaf3fb" stroke="#2f6f9f" stroke-width="2"/>
  <text font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#111827"><tspan x="446" y="255">Session</tspan></text>
  <text font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#334155"><tspan x="446" y="286">User is</tspan><tspan x="446" dy="17">authenticated</tspan><tspan x="446" dy="17">inside isolated</tspan><tspan x="446" dy="17">browsing.</tspan></text>
  <line x1="584" y1="282" x2="592" y2="282" stroke="#64748b" stroke-width="3" marker-end="url(#arrowhead)"/>
  <rect x="602" y="224" width="146" height="118" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#111827"><tspan x="618" y="255">Theft</tspan></text>
  <text font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#334155"><tspan x="618" y="286">Attacker reads</tspan><tspan x="618" dy="17">live cookies or</tspan><tspan x="618" dy="17">bearer tokens.</tspan></text>
  <line x1="756" y1="282" x2="764" y2="282" stroke="#64748b" stroke-width="3" marker-end="url(#arrowhead)"/>
  <rect x="774" y="224" width="146" height="118" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#111827"><tspan x="790" y="255">Reuse</tspan></text>
  <text font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#334155"><tspan x="790" y="286">Token is replayed</tspan><tspan x="790" dy="17">from attacker</tspan><tspan x="790" dy="17">infrastructure.</tspan></text>
  <line x1="928" y1="282" x2="936" y2="282" stroke="#64748b" stroke-width="3" marker-end="url(#arrowhead)"/>
  <rect x="946" y="224" width="146" height="118" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#111827"><tspan x="962" y="255">Impact</tspan></text>
  <text font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#334155"><tspan x="962" y="286">Cloud account</tspan><tspan x="962" dy="17">access may bypass</tspan><tspan x="962" dy="17">fresh MFA</tspan><tspan x="962" dy="17">prompts.</tspan></text>
  <rect x="44" y="430" width="748" height="178" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#b91c1c"><tspan x="72" y="468">ANSWER</tspan></text>
  <text font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#b91c1c"><tspan x="72" y="508">Rate it High.</tspan></text>
  <text font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#334155"><tspan x="72" y="550">Reason: Cloud account access may bypass fresh MFA prompts.</tspan></text>
  <rect x="820" y="430" width="336" height="178" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="3"/>
  <text font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#b91c1c"><tspan x="848" y="468">DECISION RULE</tspan></text>
  <text font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#111827"><tspan x="848" y="510">Did a reusable secret leave</tspan><tspan x="848" dy="23">before the isolated</tspan><tspan x="848" dy="23">environment was destroyed?</tspan></text>
  <text font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#475569"><tspan x="44" y="686">Use the diagram as a reasoning aid: identify the start point, the crossed boundary, the thing that escapes, and the</tspan><tspan x="44" dy="21">resulting blast radius.</tspan></text>
</svg>
