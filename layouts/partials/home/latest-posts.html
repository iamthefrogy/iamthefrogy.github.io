{{ $posts := first 4 (where site.RegularPages "Section" "posts") }}
{{ if $posts }}
<section class="home-section home-latest">
  <div class="section-heading section-heading--split">
    <div>
      <h2 class="section-heading__title">{{ site.Params.home.latest_posts_heading | default "Latest writing" }}</h2>
      <p class="section-heading__subtitle">Long-form, practical posts from the field.</p>
    </div>
    <a class="section-heading__more" href="{{ "posts/" | relURL }}">All posts<i class="fa-solid fa-arrow-right-long" aria-hidden="true"></i></a>
  </div>
  <div class="post-list">
    {{ range $posts }}
    {{ partial "site/post-row.html" . }}
    {{ end }}
  </div>
</section>
{{ end }}
