<section class="home-section home-connect">
  <div class="home-connect__inner">
    <div class="home-connect__content">
      <h2 class="home-connect__title">Let’s connect</h2>
      <p class="home-connect__subtitle">
        Questions on a post, feedback on a tool, or just want to talk security? Write to me or find me on the links here.
      </p>
      {{ with site.Params.social.email }}
      <a class="home-connect__email" href="mailto:{{ . }}"><i class="fa-solid fa-envelope" aria-hidden="true"></i>{{ . }}</a>
      {{ end }}
    </div>
    <div class="home-connect__socials">
      {{ partial "site/socials.html" (dict "class" "home-connect__social") }}
    </div>
  </div>
</section>
